    <div class="table-responsive">
        <table class="table table-hover" mat-table [dataSource]="dataSource">

            <ng-container matColumnDef="year">
                <th mat-header-cell *matHeaderCellDef>
                    <app-column-filter title="Year" (changeSelected)="onColumnFilterOpen($event)" [selected]="selectedColumnFilter" controlName="year" (close)="onColumnFilter($event)">
                        <select class="form-control form-control-sm" [formControl]="filterForm.get('year')">
                            <option value="">Select Year</option>
                            <option *ngFor="let y of years" [value]="y">{{ y }}</option>
                        </select>
                    </app-column-filter>
                </th>
                <td mat-cell *matCellDef="let element"> {{element?.year}} </td>
            </ng-container>
            <ng-container matColumnDef="month">
                <th mat-header-cell *matHeaderCellDef>
                    <app-column-filter title="Month" (changeSelected)="onColumnFilterOpen($event)" [selected]="selectedColumnFilter" controlName="month" (close)="onColumnFilter($event)">
                        <select class="form-control form-control-sm" [formControl]="filterForm.get('month')">
                            <option value="">Select Month</option>
                            <option *ngFor="let m of months" [value]="m">{{ m }}</option>
                        </select>
                    </app-column-filter>
                </th>
                <td mat-cell *matCellDef="let element"> {{element?.month}} </td>
            </ng-container>
            <ng-container matColumnDef="customer_code">
                <th mat-header-cell *matHeaderCellDef>
                    <app-column-filter title="Customer Code " (changeSelected)="onColumnFilterOpen($event)" [selected]="selectedColumnFilter" controlName="customer_code" (close)="onColumnFilter($event)">
                        <input class="form-control form-control-sm" [formControl]="filterForm.get('customer_code')" placeholder="Enter Customer Code " type="text">
                    </app-column-filter>
                </th>
                <td mat-cell *matCellDef="let element"> {{element?.customer_info?.customer_code}} </td>
            </ng-container>
            <ng-container matColumnDef="customer_name">
                <th mat-header-cell *matHeaderCellDef>
                    <app-column-filter title="Customer Name " (changeSelected)="onColumnFilterOpen($event)" [selected]="selectedColumnFilter" controlName="customer_name" (close)="onColumnFilter($event)">
                        <input class="form-control form-control-sm" [formControl]="filterForm.get('customer_name')" placeholder="Enter Customer Name " type="text">
                    </app-column-filter>
                </th>
                <td mat-cell *matCellDef="let element"> {{element?.customer_info?.user?.firstname}} </td>
            </ng-container>
            <ng-container matColumnDef="item_code">
                <th mat-header-cell *matHeaderCellDef>
                    <app-column-filter title="Item Code " (changeSelected)="onColumnFilterOpen($event)" [selected]="selectedColumnFilter" controlName="item_code" (close)="onColumnFilter($event)">
                        <input class="form-control form-control-sm" [formControl]="filterForm.get('item_code')" placeholder="Enter Item Code " type="text">
                    </app-column-filter>
                </th>
                <td mat-cell *matCellDef="let element"> {{element?.item?.item_code}} </td>
            </ng-container>
            <ng-container matColumnDef="item_name">
                <th mat-header-cell *matHeaderCellDef>
                    <app-column-filter title="Item Name" (changeSelected)="onColumnFilterOpen($event)" [selected]="selectedColumnFilter" controlName="item_name" (close)="onColumnFilter($event)">
                        <input class="form-control form-control-sm" [formControl]="filterForm.get('item_name')" placeholder="Enter Item Name " type="text">
                    </app-column-filter>
                </th>
                <td mat-cell *matCellDef="let element"> {{element?.item?.item_name}} </td>
            </ng-container>
            <ng-container matColumnDef="uom">
                <th mat-header-cell *matHeaderCellDef >
                   UOM
                </th>
                <td mat-cell *matCellDef="let element"> {{element?.item_uom?.name}} </td>
            </ng-container>
            <ng-container matColumnDef="pending_qty">
                <th mat-header-cell *matHeaderCellDef >
                   Pending Qty
                </th>
                <td mat-cell *matCellDef="let element"> {{element?.pending_qty}} </td>
            </ng-container>
            <ng-container matColumnDef="total_qty">
                <th mat-header-cell *matHeaderCellDef >
                   Total Qty
                </th>
                <td mat-cell *matCellDef="let element"> {{element?.total_qty}} </td>
            </ng-container>
            <!-- <ng-container matColumnDef="total_qty">
                <th mat-header-cell *matHeaderCellDef >
                   Qty
                </th>
                <td mat-cell *matCellDef="let element"> {{element?.qty}} </td>
            </ng-container> -->


            <tr mat-header-row *matHeaderRowDef="getDisplayedColumns();"></tr>
            <tr mat-row *matRowDef="let row; columns: getDisplayedColumns();"></tr>
        </table>
    </div>

    <div>
        <mat-paginator [hidden]="apiResponse.pagination?.total_records < 10" (page)="onPageFired($event)" [length]="apiResponse.pagination?.total_records" [pageSize]="apiResponse.pagination?.pageSize" [pageSizeOptions]="[10, 25, 50]">
        </mat-paginator>
    </div>
</section>
